<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Baraka Sovereign Emblem">
  <defs>
    <!-- Deep Obsidian / Royal Midnight Blue-Black Plate -->
    <radialGradient id="plate" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E2836" />
      <stop offset="60%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#080B10" />
    </radialGradient>

    <!-- Sovereign Metallic Gold Leaf Gradient -->
    <linearGradient id="gold" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3B8" />
      <stop offset="18%" stop-color="#E8C87A" />
      <stop offset="45%" stop-color="#BD8E32" />
      <stop offset="70%" stop-color="#E2BD64" />
      <stop offset="100%" stop-color="#8C6316" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#B88E3E" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#B88E3E" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Depth Shadow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.65)" />
    </radialGradient>
  </defs>

  <!-- Base Plate with continuous rounded squircle -->
  <rect width="512" height="512" rx="118" fill="url(#plate)" />
  <rect width="512" height="512" rx="118" fill="url(#halo)" />
  <rect width="512" height="512" rx="118" fill="url(#vignette)" />

  <!-- Outer Double Hairline Gold Border -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.5" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Medallion Center Group -->
  <g transform="translate(256, 256)">
    <!-- Outer Medallion Plate -->
    <circle r="208" fill="#111720" stroke="url(#gold)" stroke-width="5" />
    
    <!-- 36 Beaded Gold Pearls Rim -->
    <g fill="url(#gold)">
      <circle cx="0" cy="-196" r="4.5" />
      <circle cx="34" cy="-193" r="4.5" />
      <circle cx="67" cy="-184" r="4.5" />
      <circle cx="98" cy="-170" r="4.5" />
      <circle cx="126" cy="-150" r="4.5" />
      <circle cx="150" cy="-126" r="4.5" />
      <circle cx="170" cy="-98" r="4.5" />
      <circle cx="184" cy="-67" r="4.5" />
      <circle cx="193" cy="-34" r="4.5" />
      <circle cx="196" cy="0" r="4.5" />
      <circle cx="193" cy="34" r="4.5" />
      <circle cx="184" cy="67" r="4.5" />
      <circle cx="170" cy="98" r="4.5" />
      <circle cx="150" cy="126" r="4.5" />
      <circle cx="126" cy="150" r="4.5" />
      <circle cx="98" cy="170" r="4.5" />
      <circle cx="67" cy="184" r="4.5" />
      <circle cx="34" cy="193" r="4.5" />
      <circle cx="0" cy="196" r="4.5" />
      <circle cx="-34" cy="193" r="4.5" />
      <circle cx="-67" cy="184" r="4.5" />
      <circle cx="-98" cy="170" r="4.5" />
      <circle cx="-126" cy="150" r="4.5" />
      <circle cx="-150" cy="126" r="4.5" />
      <circle cx="-170" cy="98" r="4.5" />
      <circle cx="-184" cy="67" r="4.5" />
      <circle cx="-193" cy="34" r="4.5" />
      <circle cx="-196" cy="0" r="4.5" />
      <circle cx="-193" cy="-34" r="4.5" />
      <circle cx="-184" cy="-67" r="4.5" />
      <circle cx="-170" cy="-98" r="4.5" />
      <circle cx="-150" cy="-126" r="4.5" />
      <circle cx="-126" cy="-150" r="4.5" />
      <circle cx="-98" cy="-170" r="4.5" />
      <circle cx="-67" cy="-184" r="4.5" />
      <circle cx="-34" cy="-193" r="4.5" />
    </g>

    <!-- Concentric Stepped Hairline Rings -->
    <circle r="182" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="10 6" />
    <circle r="172" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Sacred 8-Pointed Star Lattice (Khatam Sulayman) -->
    <!-- Primary Square -->
    <rect x="-116" y="-116" width="232" height="232" rx="10" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-opacity="0.95" />
    <!-- Secondary Square rotated 45 deg -->
    <rect x="-116" y="-116" width="232" height="232" rx="10" fill="none" stroke="url(#gold)" stroke-width="6.5" stroke-opacity="0.95" transform="rotate(45)" />

    <!-- Subtle Inner Fill for the 8-pointed star starburst -->
    <path d="M-116,-48 L-116,48 L-48,116 L48,116 L116,48 L116,-48 L48,-116 L-48,-116 Z" fill="url(#gold)" fill-opacity="0.08" />

    <!-- Radiating Islamic Geometric Facets -->
    <g stroke="url(#gold)" stroke-width="2" stroke-opacity="0.45">
      <line x1="0" y1="-172" x2="0" y2="-116" />
      <line x1="0" y1="116" x2="0" y2="172" />
      <line x1="-172" y1="0" x2="-116" y2="0" />
      <line x1="116" y1="0" x2="172" y2="0" />
      <line x1="-122" y1="-122" x2="-82" y2="-82" />
      <line x1="82" y1="82" x2="122" y2="122" />
      <line x1="122" y1="-122" x2="82" y2="-82" />
      <line x1="-82" y1="82" x2="-122" y2="122" />
    </g>

    <!-- Inner Core Guilloché Medallion -->
    <circle r="88" fill="#0A0E14" stroke="url(#gold)" stroke-width="4.5" />
    <circle r="78" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-dasharray="5 4" stroke-opacity="0.75" />

    <!-- Sculpted Celestial Crescent in Sovereign Gold Leaf -->
    <path
      d="M12 -58 C-26 -48 -50 -14 -42 26 C-34 66 4 92 46 82 C14 84 -22 62 -28 26 C-34 -10 -8 -44 24 -56 C20 -57 16 -57.5 12 -58 Z"
      fill="url(#gold)"
    />

    <!-- Guiding 8-Pointed Star in Pure Gold -->
    <g transform="translate(30, -22)">
      <polygon
        points="0,-24 7,-7 24,0 7,7 0,24 -7,7 -24,0 -7,-7"
        fill="url(#gold)"
      />
      <circle r="3" fill="#FFF3B8" />
    </g>

    <!-- Cardinal Jewel Points -->
    <circle cx="0" cy="-148" r="4.5" fill="url(#gold)" />
    <circle cx="0" cy="148" r="4.5" fill="url(#gold)" />
    <circle cx="-148" cy="0" r="4.5" fill="url(#gold)" />
    <circle cx="148" cy="0" r="4.5" fill="url(#gold)" />
  </g>
</svg>