<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Baraka Sovereign Emblem">
  <defs>
    <!-- Luxury Obsidian Midnight Plate Gradient -->
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181E2B" />
      <stop offset="45%" stop-color="#0F131C" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>

    <!-- Sovereign Gold Leaf Gradient -->
    <linearGradient id="gold-grad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF6CC" />
      <stop offset="22%" stop-color="#F4D37D" />
      <stop offset="55%" stop-color="#C89730" />
      <stop offset="85%" stop-color="#A2731C" />
      <stop offset="100%" stop-color="#7E5410" />
    </linearGradient>

    <!-- Ambient Halo behind the emblem -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Golden Fill for inner star facets -->
    <linearGradient id="gold-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8C6316" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Luxury Squircle Base Plate -->
  <rect width="512" height="512" rx="116" fill="url(#plate-grad)" />
  <!-- Subtle Golden Outer Contour Hairline -->
  <rect
    x="14"
    y="14"
    width="484"
    height="484"
    rx="102"
    fill="none"
    stroke="url(#gold-grad)"
    stroke-width="5"
    stroke-opacity="0.45"
  />

  <!-- Sovereign Emblem Core -->
  <g transform="translate(256, 256)">
    <!-- Subtle Ambient Radial Glow -->
    <circle r="195" fill="url(#halo)" />

    <!-- Outer Circular Frame -->
    <circle
      r="192"
      fill="none"
      stroke="url(#gold-grad)"
      stroke-width="4"
      stroke-opacity="0.4"
    />

    <!-- Sacred 8-Pointed Star (Rub el Hizb) - Clean, bold, architectural strokes -->
    <rect
      x="-124"
      y="-124"
      width="248"
      height="248"
      rx="26"
      fill="url(#gold-soft)"
      stroke="url(#gold-grad)"
      stroke-width="16"
      stroke-linejoin="round"
    />
    <rect
      x="-124"
      y="-124"
      width="248"
      height="248"
      rx="26"
      fill="url(#gold-soft)"
      stroke="url(#gold-grad)"
      stroke-width="16"
      stroke-linejoin="round"
      transform="rotate(45)"
    />

    <!-- Inner Core Medallion Ring -->
    <circle
      r="82"
      fill="#0B0E15"
      stroke="url(#gold-grad)"
      stroke-width="9"
    />

    <!-- Sculpted Golden Celestial Crescent -->
    <path
      d="M14 -44 C-18 -36 -36 -8 -30 24 C-24 52 4 70 36 62 C10 63 -16 44 -20 18 C-24 -8 -4 -34 20 -43 C18 -43.6 16 -43.8 14 -44 Z"
      fill="url(#gold-grad)"
    />

    <!-- Radiant Celestial Diamond Star in the Crescent's Embrace -->
    <g transform="translate(22, -14)">
      <path
        d="M0 -22 Q2 -6 18 0 Q2 6 0 22 Q-2 6 -18 0 Q-2 -6 0 -22 Z"
        fill="url(#gold-grad)"
      />
      <circle r="3.5" fill="#FFF9D8" />
    </g>
  </g>
</svg>
