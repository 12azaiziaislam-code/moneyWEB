# ---------------------------------------------------------------------------
# Cloudflare Pages project configuration
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
# ---------------------------------------------------------------------------
name = "baraka"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# --- D1 (required) ---------------------------------------------------------
# Create with:  wrangler d1 create baraka-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "baraka-db"
database_id = "d0097cc2-bfa2-4542-a0c6-d5973e01a2ca"
migrations_dir = "migrations"

# --- R2 (optional) ---------------------------------------------------------
# Only enable this block if you created the bucket AND set USE_R2="true".
# Create with:  wrangler r2 bucket create baraka-media
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "baraka-media"

# --- Public (non-secret) variables ----------------------------------------
# Secrets (GATEWAY_API_KEY, FIREBASE_API_KEY) MUST be set with
#   wrangler pages secret put <NAME> --project-name baraka
[vars]
FIREBASE_PROJECT_ID = "your-project"
APP_VERSION = "1.0.0"
USE_R2 = "false"
APP_ORIGIN = "https://baraka-75t.pages.dev,https://baraka.pages.dev"
RATE_LIMIT_PER_HOUR = "30"
RATE_LIMIT_PER_DAY = "200"
MAX_BODY_BYTES = "6000000"
MAX_IMAGE_BYTES = "1200000"
GATEWAY_BASE_URL = "https://gemma-gateway.pages.dev/v1"
